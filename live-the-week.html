<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Live the Week v1.9 — overhead 3/4</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; padding:0; background:#141b16; height:100%; overflow:hidden;
    font-family:-apple-system,system-ui,sans-serif; color:#f2f5ef; }
  body { display:flex; flex-direction:column; align-items:center; }
  #hud { width:100%; max-width:430px; display:flex; justify-content:space-between; align-items:center;
    padding:8px 10px; background:#24402e; font-size:13px; z-index:5; gap:6px; }
  #hud b { color:#bfe3c6; }
  #stage { position:relative; width:100%; max-width:430px; flex:1; min-height:0; display:flex; justify-content:center; }
  canvas { height:100%; aspect-ratio:11/20; image-rendering:pixelated; touch-action:manipulation;
    background:#5d8a5f; max-width:100%; }
  #locname { position:absolute; top:8px; left:50%; transform:translateX(-50%); background:rgba(16,21,16,.75);
    padding:4px 14px; border-radius:14px; font-size:13px; color:#dff0e2; pointer-events:none; }
  #phonebtn { position:fixed; right:12px; bottom:12px; width:58px; height:58px; border-radius:50%;
    background:#f2f5ef; font-size:28px; border:3px solid #24402e; z-index:20; }
  #phone { position:fixed; left:50%; transform:translateX(-50%); bottom:0; width:min(420px,96vw); height:74vh;
    background:#101510; border:3px solid #3a5a40; border-bottom:none; border-radius:22px 22px 0 0;
    z-index:30; display:none; flex-direction:column; overflow:hidden; }
  #phone.open { display:flex; }
  #notch { height:24px; display:flex; align-items:center; justify-content:center; }
  #notch span { width:100px; height:16px; background:#000; border-radius:9px; }
  #pclock { text-align:center; font-size:12px; color:#9fc3a4; padding:2px; }
  #tabs { display:flex; background:#1a241c; }
  #tabs button { flex:1; padding:10px 2px; background:none; border:none; color:#9fc3a4; font-size:12px; }
  #tabs button.on { color:#fff; background:#24402e; font-weight:700; }
  #msgdot { color:#ff6a5a; font-size:10px; }
  #pscreen { flex:1; overflow-y:auto; padding:10px; font-size:14px; background:linear-gradient(180deg,#101510 0%,#0c120d 100%); }
  .card { background:#1c2b21; border:1px solid #3a5a40; border-radius:10px; padding:10px; margin-bottom:8px; }
  .card h4 { margin:0 0 6px; color:#bfe3c6; font-size:14px; }
  .row { display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid #2a3d30; gap:8px;}
  .row:last-child { border-bottom:none; }
  button.act { background:#3f7a4d; color:#fff; border:none; border-radius:8px; padding:8px 12px; font-size:14px; }
  button.act:disabled { background:#3a4a3e; color:#7a8a7e; }
  button.ghost { background:none; color:#9fc3a4; border:1px solid #3a5a40; border-radius:8px; padding:8px 12px; font-size:14px; }
  #dlg { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:50; display:none; align-items:center; justify-content:center; padding:20px; }
  #dlg.open { display:flex; }
  #dlgbox { background:#f2f5ef; color:#1c2b21; border-radius:14px; padding:18px; max-width:340px; width:100%; }
  #dlgbox h3 { margin:0 0 8px; font-size:17px; }
  #dlgbox p { font-size:14px; margin:0 0 12px; }
  #dlgbtns { display:flex; gap:8px; flex-wrap:wrap; }
  #dlgbtns button { flex:1; min-width:100px; padding:10px; border-radius:10px; font-size:15px; border:none; }
  #toast { position:fixed; left:50%; transform:translateX(-50%); bottom:84px; background:#101510; color:#dff0e2;
    padding:8px 16px; border-radius:20px; font-size:13px; z-index:40; display:none; border:1px solid #3a5a40;
    max-width:92vw; text-align:center; }
  .post { border-bottom:1px solid #2a3d30; padding:8px 0; font-size:13px; }
  .post .who { color:#bfe3c6; font-weight:700; }
  #review { position:fixed; inset:0; background:#1c2b21; z-index:60; display:none; overflow-y:auto; padding:20px; }
  #review.open { display:block; }
  .big { font-size:22px; font-weight:800; color:#bfe3c6; }
  .neg { color:#ff9d8a; } .pos { color:#9fe6a8; }
  #start { position:fixed; inset:0; background:#1c2b21; z-index:70; display:flex; align-items:center; justify-content:center; padding:24px; }
  #startbox { max-width:380px; text-align:center; }
  #startbox h1 { color:#bfe3c6; }
  .agepick,.jobpick { display:flex; gap:8px; justify-content:center; margin:12px 0; flex-wrap:wrap; }
  .agepick button,.jobpick button { padding:10px 14px; border-radius:10px; border:2px solid #3a5a40; background:#24402e; color:#fff; font-size:14px; }
  .jobpick button { padding:8px 10px; font-size:13px; flex:1; min-width:0; }
  .agepick button.on,.jobpick button.on { border-color:#bfe3c6; background:#3f7a4d; }
  #fade { position:absolute; inset:0; background:#000; opacity:0; pointer-events:none; transition:opacity .25s; z-index:8;}
  #spots{position:absolute;inset:0;pointer-events:none;z-index:7}
  .spot.npcspot{background:transparent;border:none;box-shadow:none;}

  /* ===== Tablet/Desktop: wider game, themed background ===== */
  @media (min-width:768px){
    html,body { background:#0e140f; }
    body {
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(63,122,77,.15) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 50% 100%, rgba(63,122,77,.10) 0%, transparent 60%),
        #0e140f;
    }
    body::before {
      content:'\1F33F NWS \u2022 Live the Week';
      position:fixed; left:24px; top:20px; font-size:15px; font-weight:700; color:#3a5a40;
      letter-spacing:1px; z-index:0; pointer-events:none;
    }
    body::after {
      content:'A TruJoe Digital financial literacy game';
      position:fixed; left:24px; bottom:20px; font-size:12px; color:#2a3d30;
      z-index:0; pointer-events:none;
    }
    #hud { max-width:520px; font-size:14px; border-radius:0 0 12px 12px; }
    #stage { max-width:520px; }
    #objective { max-width:520px; margin:0 auto; width:100%; border-radius:0 0 8px 8px; }
    #phone { width:min(480px,92vw); }
    #startbox { max-width:440px; }
    #dlgbox { max-width:400px; }
  }
  @media (min-width:1200px){
    #hud { max-width:560px; }
    #stage { max-width:560px; }
    #objective { max-width:560px; }
  }
 .spot{position:absolute;pointer-events:auto;background:rgba(20,28,22,.82);color:#f2e8c9;border:1.5px solid #7fd6a4;border-radius:12px;font-size:12px;font-weight:700;padding:8px 10px;transform:translate(-50%,-50%);box-shadow:0 2px 8px rgba(0,0,0,.4)}
</style>
</head>
<body>
<div id="hud">
  <span>📅 <b id="h_day">Mon</b> <span id="h_time">8:00a</span></span>
  <span>💵 <b id="h_money">$70</b></span>
  <span>⚡ <b id="h_energy">100</b></span>
  <span style="font-size:10px;color:#6a8a72">v1.9</span>
  <button id="waitbtn" class="ghost" style="padding:4px 10px;font-size:12px">⏳ +30m</button>
</div>
<div id="objective" style="text-align:center;font-size:12px;color:#9fc3a4;padding:4px;background:rgba(20,30,22,.9);border-bottom:1px solid #3a5a40"></div>
<div id="stage">
  <canvas id="game" width="352" height="640"></canvas>
  <div id="locname">Maple Street</div>
  <div id="fade"></div>
  <div id="spots"></div>
</div>
<button id="phonebtn">📱</button>
<div id="phone">
  <div id="notch"><span></span></div>
  <div id="pclock"><button id="pclose" class="ghost" style="float:right;padding:2px 10px;font-size:14px">✕</button>LiveOS · <span id="p_time">Mon 8:00a</span></div>
  <div id="tabs">
    <button data-t="money" class="on">💵 Money</button>
    <button data-t="jobs">🧑‍🍳 Work</button>
    <button data-t="social">🌀 Social</button>
    <button data-t="shop">🛒 Shop</button>
    <button data-t="msgs">✉️ Msgs <span id="msgdot"></span></button>
  </div>
  <div id="pscreen"></div>
</div>
<div id="dlg"><div id="dlgbox"><h3 id="d_h"></h3><p id="d_p"></p><div id="dlgbtns"></div></div></div>
<div id="toast"></div>
<div id="review"></div>
<div id="start"><div id="startbox">
  <h1>Live the Week</h1>
  <p style="font-size:14px;color:#cfe0d2">Suburb · one week · make it to Sunday with the bills paid.</p>
  <p style="font-size:14px">How old are you?</p>
  <div class="agepick">
    <button data-a="14-15">14–15</button>
    <button data-a="16-17" class="on">16–17</button>
    <button data-a="18+">18+</button>
  </div>
  <p style="font-size:14px">Pick your job:</p>
  <div class="jobpick" id="jobpick"></div>
  <button class="act" id="gobtn" style="font-size:17px;padding:12px 30px">Start Monday →</button>
  <p style="font-size:12px;color:#9fc3a4;margin-top:14px">Tap to walk. Walk into doors to go inside. 📱 is your hub — and your trap.</p>
</div></div>
<script>
'use strict';
/* ================= DATA ================= */
const TILE=32, COLS=11, ROWS=20;
const BLD_W=64, BLD_H=76; // town building sprite size (squat, not towers)
const JOBS = {
  '14-15': [ {id:'sitter',t:'Babysitter',w:14}, {id:'yard',t:'Yard work',w:14}, {id:'dog',t:'Dog walker',w:13} ],
  '16-17': [ {id:'fastfood',t:'Fast food crew',w:14}, {id:'retail',t:'Retail associate',w:14}, {id:'park',t:'Park maintenance',w:15} ],
  '18+':   [ {id:'lawn',t:'Lawn care crew',w:16}, {id:'retail',t:'Retail associate',w:14} ]
};
const MAXHRS = { '14-15':18, '16-17':25, '18+':40 };
const BILLS_SUNDAY = 230, TAKE_HOME = 0.92;
const ADS = [
  {t:'HEADPHONES 50% OFF', p:'Studio headphones — today only $20!', c:20, item:'headphones'},
  {t:'SNEAKER DROP', p:'Limited runners $45. Everyone has them.', c:45, item:'sneakers'},
  {t:'ENERGY DRINK 6-PACK', p:'Fuel your grind. $4.', c:4},
  {t:'NEW GAME', p:'The sequel just dropped. $30.', c:30, item:'game'},
  {t:'SMART WATCH', p:'Track everything. $25.', c:25, item:'watch'}
];
const FEED = [
  {who:'@maya', p:'new sneakers 🔥🔥 (three exclamation marks of debt)'},
  {who:'@dev', p:'just got promoted to shift lead 💪'},
  {who:'@maya', p:'brunch was $28 but the pics were worth it 📸'},
  {who:'@coach', p:'free workout in the park saturday, bring water'},
  {who:'@jules', p:'POV: your savings account watching you open the delivery app 👀'},
  {who:'@dev', p:'sold my old console for half what I paid. depreciation is real 😭'},
  {who:'@priya', p:'meal prepped for the whole week. $32. feeling unstoppable'},
  {who:'@jules', p:'my 24-hour rule just saved me $80'},
  {who:'@maya', p:'thrifted this jacket for $12. vintage > new'}
];
const ROOM_ITEMS = [
  {id:'poster', t:'Band poster', c:5, room:'house'}, {id:'plant', t:'Potted plant', c:8, room:'house'},
  {id:'lamp', t:'Warm lamp', c:12, room:'house'}, {id:'rug', t:'Rug', c:20, room:'house'},
  {id:'bookshelf', t:'Bookshelf', c:25, room:'house'}, {id:'chair', t:'Armchair', c:30, room:'house'},
  {id:'f_table', t:'Coffee table', c:35, room:'house'}, {id:'sofa', t:'Sofa', c:70, room:'house'},
  {id:'nightstand', t:'Nightstand', c:18, room:'bedroom'}, {id:'dresser', t:'Dresser', c:45, room:'bedroom'},
  {id:'closet', t:'Closet', c:55, room:'bedroom'},
  {id:'headphones', t:'Headphones', c:40, room:'bedroom'}, {id:'console', t:'Game console', c:60, room:'bedroom'}
];
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
/* ================= STATE ================= */
const S = {
  dir:0,
  map:'town', day:0, min:8*60, money:70, energy:100, age:'16-17',
  job:null, accrued:0, hrsWorked:0, lastWorkDay:-1, scrolls:0, adsBought:0, resisted:0,
  mess:20, lates:0, rain:false, umbrella:false, lunchToday:false,
  spent:{}, room:[], hold24:null, groceriesBought:false,
  px:0, py:0, path:[], moving:false, hasBike:false, weekOver:false, sneakerSeen:false
};
const $ = id => document.getElementById(id);
/* ================= MAPS ================= */
// tile: 0 grass/floor, 1 road/path, 2 wall/building, 3 tree/plant, 4 door, 5 counter/shelf, 6 bed, 7 rug-deco
function emptyMap(w,h,fill){ return Array.from({length:h},()=>Array(w).fill(fill)); }
const MAPS = {};
const curMap=()=>MAPS[S.map];
function buildTown(){
  // OVERHEAD 3/4: logical tile grid for movement, smooth painterly ground rendering.
  const g = emptyMap(COLS,ROWS,0);
  for(let x=0;x<COLS;x++){ g[9][x]=1; g[10][x]=1; }   // main street (logical)
  for(let y=0;y<ROWS;y++) g[y][5]=1;                  // cross street (logical)
  const solid=(x0,y0,w,h2)=>{ for(let y=y0;y<y0+h2;y++)for(let x=x0;x<x0+w;x++) g[y][x]=2; };
  const putB=(id,x,y,w,h2,label,doorX,doorY,fp,inside)=>{
    solid(x,y,w,h2);
    MAPS.town.bld[id]={x,y,w,h:h2,label,door:[doorX,doorY],fp,inside};
    g[doorY][doorX]=4; };
  MAPS.town={ name:'Maple Street', grid:g, bld:{}, over:true,
    paths:[ [[5.5,3],[7,3]], [[7,8],[7,9.5]], [[1,5],[5.5,5]], [[8,11],[8,9.5]], [[1,15],[5.5,15]] ],
    pond:{x:2.5,y:17.5,rx:1.6,ry:1.1} };
  putB('mall',  6,1,3,2,'MALL',  7,3,null,'mallIn');
  putB('work',  7,6,2,2,'WORK',  7,8,'work',null);
  putB('coffee',1,3,2,2,'COFFEE',1,5,'coffee',null);
  putB('store', 7,12,2,2,'STORE',8,14,'store',null);
  putB('home',  1,13,2,2,'HOME',  1,15,'house',null);
  MAPS.town.bld.park={x:0,y:16,w:5,h:4,label:'PARK',door:null,fp:null,inside:null};
  [[0,16],[3,18],[4,17],[9,2],[10,15],[0,7],[4,11]].forEach(([x,y])=>{ if(g[y][x]===0) g[y][x]=3; });
  [[1,17],[2,18],[8,17],[9,18]].forEach(([x,y])=>{ if(g[y][x]===0) g[y][x]=3; });
  S.px=5*TILE; S.py=12*TILE;
}
function buildInterior(id,name,wallC,floorC){
  const g=emptyMap(COLS,ROWS,0);
  for(let x=0;x<COLS;x++){ g[0][x]=2; g[ROWS-1][x]=2; }
  for(let y=0;y<ROWS;y++){ g[y][0]=2; g[y][COLS-1]=2; }
  g[ROWS-1][5]=4; // exit door
  const m={name,grid:g,wallC:wallC||'#8a6a9a',floorC:floorC||'#c0b0c8',exit:{x:5,y:ROWS-1},interior:true};
  MAPS[id]=m; return m;
}
function buildMallIn(){
  // MALL: storefronts on back + side walls, food court as separate area at bottom.
  const m=buildInterior('mallIn','MALL','#9a8ab0','#d8cce0'); m.base='mallfloor';
  const g=m.grid;
  for(let x=1;x<=3;x++) g[3][x]=5;                              // threads storefront (back)
  for(let x=7;x<=9;x++) g[3][x]=5;                              // tech hub storefront (back)
  for(let y=6;y<=8;y++) g[y][9]=5;                              // gadget corner (right wall)
  // food court: separate area at bottom (rows 14-17), counter + tables
  for(let x=3;x<=7;x++) g[14][x]=5;                             // food counter
  g[15][4]=7; g[15][6]=7; g[16][4]=7; g[16][6]=7;               // tables (tile 7)
  for(let x=1;x<=9;x++) g[13][x]=6;                             // separator strip
  g[15][5]=3;                                                   // plant
  g[5][2]=3; g[5][8]=3; g[10][2]=3; g[10][8]=3;   // edge planters
  m.npcs=[
    {n:'Threads clerk',x:2*TILE,y:4.6*TILE,c:'#8a4a7a',spr:'wander1',say:'Hoodie $55, on sale $45. Tag says it all.'},
    {n:'Tech clerk',x:8*TILE,y:4.6*TILE,c:'#4a7a8a',spr:'wander2',say:'Headphones $75, sale $60. Best in the mall. Probably.'},
    {n:'Gadget guy',x:8*TILE,y:7*TILE,c:'#6a8a3a',spr:'barista',say:'Same headphones, $70. Sale $55. Just saying.'},
    {n:'Cashier',x:7.5*TILE,y:15.5*TILE,c:'#b86a3a',spr:'clerk',say:'Burger $12. Bubble tea $7. The smell is free.'}];
  m.storefronts=[
    {x:1,y:3,w:3,h:1,shop:'threads',name:'Threads'},
    {x:7,y:3,w:3,h:1,shop:'tech',name:'Tech Hub'},
    {x:9,y:6,w:1,h:3,shop:'gadget',name:'Gadget Corner'},
    {x:3,y:14,w:5,h:1,shop:'food',name:'Food Court'}];
  // products displayed in storefront windows: [sprite, tx, ty]
  m.goods=[['c_hoodie',1,3],['c_sneakers',2,3],['c_cap',3,3],
    ['headphones',7,3],['console',8,3],
    ['headphones',9,6],['console',9,7],
    ['c_burger',4,14],['c_boba',5,14],['c_pizza',6,14]];
  // (no text price tags: products show as pictures on the booths)
  m.spawn={x:5*TILE,y:16*TILE};
  MAPS.mallIn=m;
}
const SHOPS={
 threads:{name:'\u{1F455} Threads',items:[
   {t:'Hoodie',full:55,sale:45,spr:'c_hoodie'},
   {t:'Sneakers',full:95,sale:80,spr:'c_sneakers'},
   {t:'Cap',full:30,sale:25,spr:'c_cap'}]},
 tech:{name:'\u{1F50C} Tech Hub',items:[
   {t:'Headphones',full:75,sale:60,spr:'headphones',also:'Gadget Corner: $55'},
   {t:'Game',full:60,sale:50,spr:'console',also:'Gadget Corner: $52'}]},
 gadget:{name:'\u{1F4FB} Gadget Corner',items:[
   {t:'Headphones',full:70,sale:55,spr:'headphones',also:'Tech Hub: $60'},
   {t:'Game',full:58,sale:52,spr:'console',also:'Tech Hub: $50'}]},
 food:{name:'\u{1F354} Food Court',items:[
   {t:'Burger',full:12,sale:12,spr:'c_burger',e:10},
   {t:'Bubble tea',full:7,sale:7,spr:'c_boba',e:6},
   {t:'Pizza slice',full:5,sale:5,spr:'c_pizza',e:5}]}
};
function shopDlg(key){
  const sh=SHOPS[key];
  const box=$('dlgbox'); box.innerHTML='';
  const h3=document.createElement('h3'); h3.textContent=sh.name; box.appendChild(h3);
  const pp=document.createElement('p'); pp.style.color='#5a6a5e';
  pp.textContent='Tags don\u2019t lie. Compare before you buy.'; box.appendChild(pp);
  const grid=document.createElement('div');
  grid.style.display='grid'; grid.style.gridTemplateColumns='1fr 1fr';
  grid.style.gap='10px'; grid.style.marginBottom='12px';
  sh.items.forEach(it=>{
    const b=document.createElement('button');
    b.style.background='#fff'; b.style.border='2px solid #d8e0d4'; b.style.borderRadius='12px';
    b.style.padding='10px'; b.style.cursor='pointer'; b.dataset.shop='1';
    if(SPR_DATA[it.spr]){ const img=document.createElement('img'); img.src=SPR_DATA[it.spr];
      img.style.width='56px'; img.style.height='56px'; img.style.imageRendering='pixelated';
      b.appendChild(img); }
    const nm=document.createElement('div'); nm.style.fontWeight='bold'; nm.style.margin='6px 0 4px';
    nm.textContent=it.t; b.appendChild(nm);
    const pr=document.createElement('div');
    if(it.full>it.sale){
      const pct=Math.round((1-it.sale/it.full)*100);
      const old=document.createElement('span');
      old.style.textDecoration='line-through'; old.style.color='#d33'; old.textContent='$'+it.full;
      const now=document.createElement('b'); now.style.color='#1a7a3a'; now.textContent=' $'+it.sale;
      const off=document.createElement('span');
      off.style.background='#d33'; off.style.color='#fff'; off.style.fontSize='11px';
      off.style.padding='2px 6px'; off.style.borderRadius='8px'; off.textContent=' -'+pct+'%';
      pr.appendChild(old); pr.appendChild(now); pr.appendChild(off);
    } else { const now=document.createElement('b'); now.style.color='#1a7a3a'; now.textContent='$'+it.sale; pr.appendChild(now); }
    b.appendChild(pr);
    if(it.e){ const e=document.createElement('div'); e.style.fontSize='12px'; e.style.color='#8a6a1a';
      e.textContent='+'+it.e+'\u26A1'; b.appendChild(e); }
    if(it.also){ const a=document.createElement('div'); a.style.fontSize='11px'; a.style.color='#6a7a8a';
      a.textContent=it.also; b.appendChild(a); }
    b.onclick=()=>{ $('dlg').classList.remove('open'); buyItem(it); };
    grid.appendChild(b);
  });
  box.appendChild(grid);
  const look=document.createElement('button'); look.className='ghost'; look.style.width='100%';
  look.textContent='Just looking'; look.onclick=()=>$('dlg').classList.remove('open');
  box.appendChild(look);
  $('dlg').classList.add('open');
}
function buyItem(it){
  const c=it.sale;
  if(S.money<c){ toast('Not enough cash.'); return; }
  S.money-=c; S.spent['mall: '+it.t]=(S.spent['mall: '+it.t]||0)+c;
  if(it.e){ S.energy=Math.min(100,S.energy+it.e); S.lunchToday=true; }
  else S.energy=Math.max(0,S.energy-3); // shopping is tiring

const SPR={};
function loadSprites(){ for(const k in SPR_DATA){ const im=new Image(); im.src=SPR_DATA[k]; SPR[k]=im; } }
function blit(n,dx,dy,dw,dh){ const im=SPR[n];
  if(im&&im.complete&&im.naturalWidth){ ctx.drawImage(im,dx,dy,dw||im.naturalWidth,dh||im.naturalHeight); return true; }
  return false; }
function blitCover(n,dx,dy,dw,dh){ const im=SPR[n];  // fill rect, preserve aspect (crop)
  if(!(im&&im.complete&&im.naturalWidth)) return false;
  const ir=im.naturalWidth/im.naturalHeight, r=dw/dh;
  let sw,sh,sx,sy;
  if(ir>r){ sh=im.naturalHeight; sw=sh*r; sx=(im.naturalWidth-sw)/2; sy=0; }
  else { sw=im.naturalWidth; sh=sw/r; sx=0; sy=(im.naturalHeight-sh)/2; }
  ctx.drawImage(im,sx,sy,sw,sh,dx,dy,dw,dh); return true; }
function blitC(n,cx,feetY,bob){ const im=SPR[n];   // centered, anchored at feet
  if(im&&im.complete&&im.naturalWidth){ const w=im.naturalWidth,h=im.naturalHeight;
    ctx.drawImage(im,cx-w/2,feetY-h+(bob||0),w,h); return true; } return false; }

const TCOL={0:'#5d8a5f',1:'#777',3:'#3d6b3f',4:'#7a5c3d',5:'#8a6a45',6:'#4a6a9e'};
let CUR_BASE='grass';
const BASE_SPR={grass:'grass',sidewalk:'stonefloor',woodfloor:'woodfloor',stonefloor:'stonefloor',mallfloor:'stonefloor'};
function drawTile(x,y,t,px,py){
  if(t===2) return; // buildings drawn as blocks
  ctx.fillStyle=TCOL[t]||'#5d8a5f'; ctx.fillRect(px,py,TILE,TILE);
  if(t===0){ blit(CUR_BASE,px,py,TILE,TILE); }
  else if(t===1){ blit((x+y)%2?'road':'road2',px,py,TILE,TILE); }
  else if(t===3){ if(!curMap().interior) blit(CUR_BASE,px,py,TILE,TILE);
    blit(S.map==='town'?'tree':'plant',px+4,py+2,24,30);           // object anchored on tile
    if(S.map==='town'){ const sw=Math.sin(Date.now()/900+x)*2; } }
  else if(t===4){ blit(CUR_BASE,px,py,TILE,TILE); }
  else if(t===5){ blit('counter',px,py,TILE,TILE); }
  else if(t===7){ blit('f_table',px,py-6,TILE,TILE+6); }
  else if(t===6){ blit(CUR_BASE,px,py,TILE,TILE); blit('bed',px+6,py,20,32); }
}
const T_BLD={home:'t_home',store:'t_store',coffee:'t_coffee',mall:'t_mall',work:'t_work'};
let noiseCv=null;
function getNoise(){
  if(noiseCv) return noiseCv;
  noiseCv=document.createElement('canvas'); noiseCv.width=cv.width; noiseCv.height=cv.height;
  const n=noiseCv.getContext('2d');
  for(let i=0;i<450;i++){
    const x=Math.random()*cv.width, y=Math.random()*cv.height, r=1+Math.random()*2;
    n.fillStyle=Math.random()<0.5?'rgba(0,60,0,0.035)':'rgba(255,255,240,0.04)';
    n.beginPath(); n.arc(x,y,r,0,7); n.fill();
  }
  return noiseCv;
}
function strokePath(pts,width,color){
  ctx.strokeStyle=color; ctx.lineWidth=width; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath(); pts.forEach(([x,y],i)=>{ i?ctx.lineTo(x*TILE,y*TILE):ctx.moveTo(x*TILE,y*TILE); });
  ctx.stroke();
}
function drawGroundSmooth(m){
  // grass base: soft vertical gradient + noise (no tile seams)
  const gr=ctx.createLinearGradient(0,0,0,cv.height);
  gr.addColorStop(0,'#79bd6b'); gr.addColorStop(1,'#5da055');
  ctx.fillStyle=gr; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.drawImage(getNoise(),0,0);
  // park lawn
  const pk=m.bld.park;
  ctx.fillStyle='#86c977';
  ctx.beginPath(); ctx.ellipse((pk.x+pk.w/2)*TILE,(pk.y+pk.h/2)*TILE,pk.w*TILE/2,pk.h*TILE/2,0,0,7); ctx.fill();
  // pond
  const p=m.pond;
  ctx.fillStyle='#4f9fd0';
  ctx.beginPath(); ctx.ellipse(p.x*TILE,p.y*TILE,p.rx*TILE,p.ry*TILE,0,0,7); ctx.fill();
  ctx.fillStyle='#8fd0ee';
  ctx.beginPath(); ctx.ellipse(p.x*TILE-8,p.y*TILE-6,p.rx*TILE*0.55,p.ry*TILE*0.5,0,0,7); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.7)';
  [[-14,-4],[6,8],[18,-8]].forEach(([dx,dy])=>{ ctx.beginPath(); ctx.arc(p.x*TILE+dx,p.y*TILE+dy,2.5,0,7); ctx.fill(); });
  // dirt paths to doors (smooth)
  (m.paths||[]).forEach(pts=>strokePath(pts,26,'#d9c08e'));
  // roads (smooth, no seams)
  ctx.strokeStyle='#6e6e78'; ctx.lineCap='round';
  ctx.lineWidth=72; ctx.beginPath(); ctx.moveTo(-10,9.5*TILE); ctx.lineTo(cv.width+10,9.5*TILE); ctx.stroke();
  ctx.lineWidth=40; ctx.beginPath(); ctx.moveTo(5.5*TILE,-10); ctx.lineTo(5.5*TILE,cv.height+10); ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.10)'; ctx.lineWidth=72;
  ctx.beginPath(); ctx.moveTo(-10,9.2*TILE); ctx.lineTo(cv.width+10,9.2*TILE); ctx.stroke();
}
function drawMall(mm){
  // polished mall floor with central runner
  ctx.fillStyle='#e8e0d8'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.fillStyle='#d8cec2';
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)
    if((x+y)%2===0) ctx.fillRect(x*TILE,y*TILE,TILE,TILE);
  // central carpet runner
  ctx.fillStyle='#b86a8a'; ctx.fillRect(4*TILE,4*TILE,3*TILE,8*TILE);
  ctx.fillStyle='#a05a7a'; ctx.fillRect(4*TILE+6,4*TILE,4,8*TILE); ctx.fillRect(7*TILE-10,4*TILE,4,8*TILE);
  // food court floor (separate, wood)
  ctx.fillStyle='#c9a06a'; ctx.fillRect(0,14*TILE,cv.width,4*TILE);
  ctx.fillStyle='#b8905a';
  for(let y=14;y<18;y++)for(let x=0;x<COLS;x++) if((x+y)%2===0) ctx.fillRect(x*TILE,y*TILE,TILE,TILE);
  // separator
  ctx.fillStyle='#8a6a4a'; ctx.fillRect(0,13*TILE,cv.width,8);
  // skylight glow from above
  const sg=ctx.createLinearGradient(0,0,0,200);
  sg.addColorStop(0,'rgba(255,255,240,.25)'); sg.addColorStop(1,'rgba(255,255,240,0)');
  ctx.fillStyle=sg; ctx.fillRect(0,0,cv.width,200);
  // storefront facades with signs
  ctx.textAlign='center';
  for(const sf of (mm.storefronts||[])){
    const sx=sf.x*TILE, sy=sf.y*TILE, sw=sf.w*TILE;
    // facade
    ctx.fillStyle='#f0e8dc'; ctx.fillRect(sx,sy-24,sw,24+TILE);
    ctx.fillStyle='#d0c0a8'; ctx.fillRect(sx,sy-24,sw,6);
    // sign
    ctx.fillStyle='#2a3a4a'; ctx.fillRect(sx+4,sy-20,sw-8,14);
    ctx.fillStyle='#fff'; ctx.font='bold 9px sans-serif';
    ctx.fillText(sf.name,sx+sw/2,sy-9);
    // window display
    ctx.fillStyle='#a8d8e8'; ctx.fillRect(sx+6,sy+6,sw-12,TILE-12);
    ctx.fillStyle='rgba(255,255,255,.3)'; ctx.fillRect(sx+6,sy+6,sw-12,6);
  }
  // products in windows (small)
  for(const [spr,x,y] of (mm.goods||[])) blit(spr,x*TILE+4,y*TILE+2,24,24);
  // plants in atrium
  blit('plant',5*TILE,9*TILE,28,36); blit('plant',5*TILE,11*TILE,28,36);
  for(const [px,py] of [[2,5],[8,5],[2,10],[8,10]]) blit('plant',px*TILE,py*TILE-4,32,40);
  // food court tables + plant (tile 7/3 in collision map; drawn here so they're visible)
  for(const [tx,ty] of [[4,15],[6,15],[4,16],[6,16]]) blit('f_table',tx*TILE,ty*TILE-6,TILE,TILE+6);
  blit('plant',5*TILE+4,15*TILE+2,24,30);
  // exit door at bottom (5,19) — prominent so players know how to leave
  ctx.fillStyle='#2a3a2e'; ctx.fillRect(5*TILE-4,18*TILE+8,TILE+8,2*TILE-8);
  ctx.fillStyle='#4a7a52'; ctx.fillRect(5*TILE,18*TILE+12,TILE,2*TILE-12);
  ctx.fillStyle='#ffe27a'; ctx.fillRect(5*TILE+4,18*TILE+16,TILE-8,10);
  ctx.fillStyle='#1c2b21'; ctx.font='bold 9px sans-serif'; ctx.textAlign='center';
  ctx.fillText('EXIT',5*TILE+16,18*TILE+24);
}
function drawBuilding34(b,id){
  if(id==='park'){
    ctx.fillStyle='#2c4a2e'; ctx.font='bold 11px sans-serif'; ctx.textAlign='center';
    ctx.fillText('🌳 PARK',(b.x+b.w/2)*TILE,(b.y+0.6)*TILE);
    return;
  }
  const spr=T_BLD[id], W=BLD_W, H=BLD_H;
  const bx=(b.x+b.w/2)*TILE-W/2, by=(b.y+b.h)*TILE-H;
  // soft drop shadow (sells the tilt)
  ctx.fillStyle='rgba(0,0,0,.22)';
  ctx.beginPath(); ctx.ellipse(bx+W/2+5,by+H-3,W*0.55,8,0,0,7); ctx.fill();
  if(spr) blit(spr,bx,by,W,H);
  // hanging sign near the door (always on-screen)
  const cx=(b.x+b.w/2)*TILE, py=by+H-14;
  ctx.fillStyle='rgba(24,32,26,.85)';
  ctx.font='bold 9px sans-serif';
  const w=ctx.measureText(b.label).width+14;
  ctx.fillRect(cx-w/2,py-9,w,15);
  ctx.fillStyle='#f2e8c9'; ctx.textAlign='center';

const SPEED_W=95, SPEED_B=190;
function tileOf(px,py){ return [Math.floor(px/TILE),Math.floor(py/TILE)]; }
function bfs(tx,ty){
  const [sx,sy]=tileOf(S.px,S.py);
  if(!walkable(tx,ty)) return null;
  const key=(x,y)=>x+','+y, prev={[key(sx,sy)]:null}, q=[[sx,sy]];
  while(q.length){ const [x,y]=q.shift();
    if(x===tx&&y===ty){ const p=[]; let k=key(tx,ty);
      while(k){ const [ax,ay]=k.split(',').map(Number); p.unshift([ax,ay]); k=prev[k]; } return p.slice(1); }
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx,ny=y+dy,kk=key(nx,ny);
      if(walkable(nx,ny)&&!(kk in prev)){ prev[kk]=key(x,y); q.push([nx,ny]); } } }
  return null;
}
cv.addEventListener('pointerdown',e=>{
  if(S.weekOver||S.fp) return;
  const r=cv.getBoundingClientRect();
  const wx=(e.clientX-r.left)/r.width*cv.width, wy=(e.clientY-r.top)/r.height*cv.height;
  const m=curMap();
  const tx=Math.floor(wx/TILE), ty=Math.floor(wy/TILE);
  // mall: storefront taps take priority over nearby clerk NPCs
  if(S.map==='mallIn'){
    for(const sf of (m.storefronts||[])){
      if(tx>=sf.x&&tx<sf.x+sf.w&&ty>=sf.y&&ty<sf.y+sf.h){
        // find walkable tile in front of storefront
        const [px,py]=tileOf(S.px+16,S.py+16);
        let best=null,bd=1e9;
        for(let bx=sf.x;bx<sf.x+sf.w;bx++)for(let by=sf.y;by<sf.y+sf.h;by++){
          for(const [ox,oy] of [[0,1],[0,-1],[1,0],[-1,0]]){
            const nx=bx+ox,ny=by+oy;
            if(walkable(nx,ny)){ const d=Math.abs(px-nx)+Math.abs(py-ny);
              if(d<bd){ bd=d; best=[nx,ny]; } }
          }
        }
        if(!best){ toast('Cannot reach '+sf.name+'.'); return; }
        const openShop=()=>{ if(sf.shop==='threads'&&!S.sneakerSeen){ S.sneakerSeen=true; sneakerPrompt(); } else shopDlg(sf.shop); };
        if(bd===0){ openShop(); return; } // already there
        const path=bfs(best[0],best[1]);
        if(path&&path.length){ S.pendingAction=openShop; S.path=path.map(([x,y])=>({x:x*TILE,y:y*TILE})); S.moving=true; }
        else toast('No path to '+sf.name+'.');
        return;
      }
    }
  }
  // npc tap? (after mall storefronts so clerks don't swallow shop taps)
  for(const n of (m.npcs||[])){
    if(Math.hypot(wx-n.x,wy-(n.y+16))<36){ npcTalk(n); return; }
  }

  const hit=buildingAt(tx,ty);
  if(hit&&hit.door){
    const [dx,dy]=hit.door, [px,py]=tileOf(S.px+16,S.py+16);

    const p=bfs(dx,dy); if(p&&p.length){ S.path=p.map(([x,y])=>({x:x*TILE,y:y*TILE})); S.moving=true; }
    else toast('No path to '+hit.label.toLowerCase()+'.');
    return;
  }
  const p=bfs(tx,ty); if(p&&p.length){ S.path=p.map(([x,y])=>({x:x*TILE,y:y*TILE})); S.moving=true; }
});
function buildingAt(tx,ty){
  const m=curMap(); if(!m.bld) return null;
  for(const k in m.bld){ const b=m.bld[k];
    if(b.x===undefined||!b.door) continue;
    // tall 3/4 sprite: centered on footprint, extends BLD_H above its base
    const cx=(b.x+b.w/2)*TILE, bot=(b.y+b.h)*TILE;
    const vx0=Math.floor((cx-BLD_W/2)/TILE), vx1=Math.floor((cx+BLD_W/2)/TILE);
    const vy0=Math.floor((bot-BLD_H)/TILE), vy1=b.y+b.h-1;
    if(tx>=vx0&&tx<=vx1&&ty>=vy0&&ty<=vy1) return b; }
  return null;
}

function step(now){

    const t=S.path[0], sp=(S.hasBike?SPEED_B:SPEED_W)*(0.55+0.45*S.energy/100)*(S.rain&&!S.umbrella?0.8:1);
    const dx=t.x-S.px, dy=t.y-S.py, d=Math.hypot(dx,dy);
    if(d<2){ S.px=t.x; S.py=t.y; S.path.shift();
      advance(S.hasBike?1:2); if(S.map!=='mallIn') S.energy=Math.max(0,S.energy-(S.hasBike?0.15:0.35)); checkTile(); checkZones();
      if(!S.path.length){ S.moving=false; onArrive(); }
    } else { S.px+=dx/d*sp*dt; S.py+=dy/d*sp*dt;
      S.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?3:2):(dy>0?0:1); }

      const keepMap=S.map; S.map=w.map;
      const p=bfs(gx,gy);

function hud(){ $('h_day').textContent=DAYS[S.day]; $('h_time').textContent=fmt(S.min);
  const ob=$('objective'); if(ob) ob.textContent=dailyObjective();
  $('p_time').textContent=DAYS[S.day]+' '+fmt(S.min);
  $('h_money').textContent='$'+Math.round(S.money); $('h_energy').textContent=Math.round(S.energy); }
function advance(min){
  if(S.weekOver) return;
  const before=S.min;
  S.min+=min;
  if(before<12*60&&S.min>=12*60) lunchCheck();
  if(S.min>=22*60) endDay();
  hud();
}
function lunchCheck(){
  if(S.groceriesBought){ S.energy=Math.min(100,S.energy+10); toast('\u{1F371} Lunch at home. $0. Groceries pay off. (+10\u26A1)'); }
  else if(!S.lunchToday){ S.energy=Math.max(0,S.energy-15); toast('\u{1F635} No lunch \u2014 energy crash. (\u221215\u26A1)'); }
}
function endDay(){
  S.day++;
  if(S.day>6) return sundayReview();
  const crashed=S.energy<25;   // too tired to clean last night
  S.mess=Math.min(100,S.mess+6+(crashed?10:0));
  S.min=8*60; S.energy=100; S.path=[]; S.moving=false;
  S.lunchToday=false; S.rain=Math.random()<0.25;
  if(S.mess>=60){ S.energy=Math.max(0,S.energy-8); }
  if(S.rain) pushMsg('weather','\u{1F327} Rain today \u2014 walking is slower. An umbrella ($12, corner store) fixes it.');
  if(S.mess>=80&&!S.messWarned){ S.messWarned=true; pushMsg('mom','Your room is a disaster zone. Clean it TODAY. \u2014 Mom'); }
  if(S.day===2) pushMsg('friend','Party Saturday night! $15 cover. You in? Tap to reply.');
  if(S.day===4) pushMsg('mom',"Rent's due Sunday. $230. Don't spend it all, please.");
  if(S.day===6) pushMsg('mom','Proud of you for making it through the week. ❤️');
  if(S.day===5&&S.hold24) pushMsg('store','Your 24-hour sneaker hold expires tonight. Still want them? $45.');
  if(S.day===5) pushMsg('coach','Free workout in the park today! Find the bench. 💪');
  toast('\u{1F319} '+DAYS[S.day]+' \u2014 a new day.'+(S.mess>=60?' Your room is a mess (\u22128\u26A1).':''));
  hud(); if($('phone').classList.contains('open')) renderPhone();
}
function sleep(){ S.min=22*60-1; advance(1); toast('😴 Slept. Energy restored.'); }
/* ================= DIALOG / TOAST / MSGS ================= */
let toastT=null;
function toast(t){ const el=$('toast'); el.textContent=t; el.style.display='block';
  clearTimeout(toastT); toastT=setTimeout(()=>el.style.display='none',2600); }
function dlg(h,p,btns){ $('d_h').textContent=h; $('d_p').textContent=p;
  const bb=$('dlgbtns'); bb.innerHTML='';
  btns.forEach(([t,fn,cls])=>{ const b=document.createElement('button');
    b.textContent=t; b.className=cls||'act'; b.onclick=()=>{ $('dlg').classList.remove('open'); fn&&fn(); };
    bb.appendChild(b); });
  $('dlg').classList.add('open'); }
const MSGS=[];
function pushMsg(from,text){ MSGS.unshift({from,text,day:DAYS[S.day],time:fmt(S.min)});
  $('msgdot').textContent='●'; if($('phone').classList.contains('open')&&curTab==='msgs') renderPhone(); }
function spend(amt,cat){ if(S.money<amt){ toast('Not enough cash.'); return false; }
  S.money-=amt; S.spent[cat]=(S.spent[cat]||0)+amt;
  if(cat==='groceries') S.groceriesBought=true;
  floatText('-$'+amt,S.px+16,S.py,'#ff9d8a'); hud(); return true; }
function earn(amt,cat){ S.money+=amt; S.spent[cat]=(S.spent[cat]||0)-amt;
  floatText('+$'+amt.toFixed(0),S.px+16,S.py,'#9fe6a8'); hud(); }
/* ================= ARRIVALS & NPCS ================= */
function inPark(){ const b=curMap().bld&&curMap().bld.park; if(!b) return false;
  const [tx,ty]=[Math.floor((S.px+16)/TILE),Math.floor((S.py+16)/TILE)];
  return tx>=b.x&&tx<b.x+b.w&&ty>=b.y&&ty<b.y+b.h; }
function onArrive(){
  if(S.pendingAction){ const fn=S.pendingAction; S.pendingAction=null; fn(); return; }
  if(S.map==='town'){
    if(inPark()){
      const pb=[['Rest 1h',()=>{ advance(60); S.energy=Math.min(100,S.energy+20); toast('Rested. Free beats the phone.'); },'act']];
      if(S.day===5) pb.unshift(['💪 Workout',()=>{ advance(60); S.energy=Math.min(100,S.energy+30); toast('Free workout! +30 energy.'); },'act']);
      pb.push(['Keep going',()=>{},'ghost']);
      dlg('🌳 Park bench','Free. Rest here an hour? (+20 energy, costs 60 min)',pb);
    }
  }
}
function sneakerPrompt(){
  dlg('👟 SNEAKER SALE','Limited runners, $45. Everyone has them. Your 24-hour rule says: wait a day.',
    [['Buy $45',()=>{ spend(45,'sneakers'); },'act'],
     ['Hold 24h (free)',()=>{ S.hold24={cost:45}; toast('On hold. See if you still want them tomorrow.'); },'ghost'],
     ['Walk away',()=>{ S.resisted++; },'ghost']]);
}
const SHIFT_HRS={'14-15':4,'16-17':4,'18+':8}; // 18+ works real 8h shifts
function workPrompt(){
  const HRS=SHIFT_HRS[S.age], left=MAXHRS[S.age]-S.hrsWorked, cost=Math.round(HRS*7.5);
  if(left<HRS){ toast('Hour limit for your age ('+MAXHRS[S.age]+'/wk). Real law!'); return; }
  if(S.energy<cost){ toast('Too exhausted for '+HRS+'h. Rest first.'); return; }
  let pay=S.job.w*HRS*TAKE_HOME, lateNote='';
  if(S.min>9*60+30){ pay*=0.9; S.lates++; lateNote=' Late clock-in (after 9:30a): \u221210% pay.';
    if(S.lates===3) pushMsg('boss','Third late. One more and we need to talk. \u2014 Management');
    else if(S.lates>3) pushMsg('boss','Late again. This is going in your file. \u2014 Management'); }
  dlg('\u{1F550} Time card','Clock in for an '+HRS+'-hour shift as '+S.job.t+'? Pays $'+pay.toFixed(2)+' Friday (take-home). Costs '+HRS+'h and '+cost+' energy.'+lateNote,
    [['Clock in',()=>{ advance(HRS*60); S.energy-=cost; S.accrued+=pay; S.hrsWorked+=HRS; S.lastWorkDay=S.day;
       floatText('shift +$'+pay.toFixed(0),S.px+16,S.py,'#9fe6a8'); hud(); toast('\u2705 Clocked out \u2014 shift complete.'); },'act'],
     ['Not now',()=>{},'ghost']]);
}
function sleepDlg(){
  dlg('\u{1F6CF}\uFE0F Bed','Call it a day? Sleep restores energy and starts tomorrow.',
    [['Sleep',()=>sleep(),'act'],['Not yet',()=>{},'ghost']]);
}
function buyGroceries(){
  if(spend(65,'groceries')){ toast('Fridge stocked. A bill, not a choice.'); renderSpots(); }
}
function buySnack(){
  if(spend(6,'snacks')){ S.energy=Math.min(100,S.energy+8); S.lunchToday=true;
    toast('Snack break. +8 energy.'); }
}
function buyLatte(){
  if(spend(5,'coffee')){ S.energy=Math.min(100,S.energy+6);
    toast('Tasty. $5 gone. +6 energy.'); }
}
function buyUmbrella(){
  if(spend(12,'umbrella')){ S.umbrella=true; toast('\u2602\uFE0F Umbrella bought. Rain: handled.'); renderSpots(); }
}
function workSchedule(){
  dlg('\u{1F4CB} Schedule','Expected at work by 9:00a sharp. Clock in after 9:30a = late, −10% pay.\nLates so far: '+S.lates+'. Hours: '+S.hrsWorked+'/'+MAXHRS[S.age]+'.',
    [['OK',()=>{},'ghost']]);
}
function npcTalk(n){
  if(n.n==='Clerk') dlg('🏪 Clerk',n.say,
    [['Groceries $65',()=>{ if(spend(65,'groceries')) toast('Fridge stocked. A bill, not a choice.'); },'act'],
     ['Snacks $6',()=>{ spend(6,'snacks'); },'ghost'],
     ['Just looking',()=>{ S.resisted++; },'ghost']]);
  else if(n.n==='Barista') dlg('☕ Barista',n.say,
    [['Latte $5',()=>{ if(spend(5,'coffee')) toast('Tasty. $5 gone.'); },'act'],
     ['Just the smell',()=>{ S.resisted++; toast('Free aroma. Full wallet.'); },'ghost']]);
  else dlg('💬 '+n.n,n.say,[['Bye',()=>{},'ghost']]);
}
/* ================= PHONE ================= */
let curTab='money';
$('phonebtn').onclick=()=>{ const p=$('phone'); p.classList.toggle('open');
  if(p.classList.contains('open')){ maybeAd(); renderPhone(); } };
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{ openPhone(b.dataset.t); });
function openPhone(t){ curTab=t||curTab; $('phone').classList.add('open'); renderPhone(); }
$('pclose').onclick=()=>$('phone').classList.remove('open');
function maybeAd(){
  if(Math.random()<0.35&&S.money>0){
    const ad=ADS[Math.floor(Math.random()*ADS.length)]; S.adsSeen=(S.adsSeen||0)+1;
    setTimeout(()=>dlg('📢 '+ad.t,ad.p+'  [sponsored]',
      [['Buy $'+ad.c,()=>{ if(spend(ad.c,'ad: '+ad.t)){ S.adsBought++;
        if(ad.item){ const it=ROOM_ITEMS.find(i=>i.id===ad.item); if(it&&!S.room.includes(it)) S.room.push(it); }
        toast('Bought from an ad. It was that easy.'); } },'act'],
       ['Dismiss',()=>{ S.resisted++; },'ghost']]),600);
  }
}
function renderPhone(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===curTab));
  const el=$('pscreen'); let h='';
  const bills=BILLS_SUNDAY-(S.groceriesBought?65:0);
  if(curTab==='money'){
    h='<div class="card"><h4>💵 Money</h4><div class="row"><span>Cash</span><b>$'+Math.round(S.money)+'</b></div>'
      +'<div class="row"><span>Earned (payday Fri)</span><b class="pos">$'+S.accrued.toFixed(2)+'</b></div>'
      +'<div class="row"><span>Bills due Sunday</span><b class="neg">$'+bills+'</b></div>'
      +'<div class="row"><span>Hours worked</span><b>'+S.hrsWorked+' / '+MAXHRS[S.age]+' max</b></div></div>'
      +'<div class="card"><h4>🧾 Spending</h4>'+(Object.keys(S.spent).length?Object.entries(S.spent).map(([k,v])=>'<div class="row"><span>'+k+'</span><b class="'+(v<0?'pos':'neg')+'">'+(v<0?'+$':'-$')+Math.abs(v).toFixed(0)+'</b></div>').join(''):'<p style="color:#9fc3a4">Nothing spent yet. Suspiciously responsible.</p>')+'</div>';
  }
  if(curTab==='jobs'){
    h='<div class="card"><h4>🧑‍🍳 Work</h4><div class="row"><span>Job</span><b>'+S.job.t+' $'+S.job.w+'/h</b></div>'
      +'<div class="row"><span>Hours</span><b>'+S.hrsWorked+' / '+MAXHRS[S.age]+'</b></div>'
      +'<div class="row"><span>Payday (Fri)</span><b class="pos">$'+S.accrued.toFixed(2)+'</b></div>'
      +'<p style="font-size:12px;color:#9fc3a4">Walk to WORK and tap the door to work a shift (4h under 18, 8h at 18+). Take-home = wage × 0.92 (FICA).</p></div>';
  }
  if(curTab==='social'){
    h='<div class="card"><h4>🌀 Scroll</h4><p style="font-size:13px;color:#9fc3a4">Just 5 minutes…</p>'
      +'<button class="act" style="width:100%" onclick="scroll()">Scroll 5 min</button>'
      +'<p style="font-size:12px;color:#9fc3a4">Scrolled '+Math.round(S.scrolls*45/60*10)/10+'h this week. +energy, −time.</p></div>';
    h+=FEED.map(f=>'<div class="post"><span class="who">'+f.who+'</span><br>'+f.p+'</div>').join('');
  }
  if(curTab==='shop'){
    h='<div class="card"><h4>🛒 Room decor</h4><p style="font-size:12px;color:#9fc3a4">Walk into HOME to see your room. Sell-back: half price.</p>';
    if(!S.hasBike) h+='<div class="row"><span>🚲 <b>Bike</b> — 2× walk speed</span><button class="act" onclick="buyBike()">$80</button></div>';
    else h+='<div class="row"><span>🚲 Bike</span><b class="pos">owned</b></div>';
    ROOM_ITEMS.forEach(it=>{ const owned=S.room.filter(i=>i.id===it.id).length;
      h+='<div class="row"><span>'+it.t+' <small style="color:#9fc3a4">'+(it.room==='bedroom'?'🛏️':'🛋️')+'</small> <b>$'+it.c+'</b>'+(owned?' <small>(x'+owned+')</small>':'')+'</span><span>'
        +'<button class="act" onclick="buyRoom(\''+it.id+'\')">Buy</button> '
        +(owned?'<button class="ghost" onclick="sellRoom(\''+it.id+'\')">Sell $'+Math.floor(it.c/2)+'</button>':'')+'</span></div>'; });
    h+='</div>';
  }
  if(curTab==='msgs'){
    $('msgdot').textContent='';
    h=MSGS.length?MSGS.map(m=>'<div class="card"><h4>'+(({boss:'🧑‍💼 Boss',friend:'🎉 Friend',mom:'🏠 Mom',store:'👟 Store',weather:'🌧 Weather',coach:'💪 Coach'})[m.from]||m.from)+' <small style="color:#9fc3a4">'+m.day+' '+m.time+'</small></h4><p style="font-size:13px">'+m.text+'</p>'
      +(m.from==='friend'&&!m.answered?'<button class="act" onclick="partyYes()">Go ($15)</button> <button class="ghost" onclick="partyNo()">Skip</button>':'')
      +(m.from==='store'&&S.hold24?'<button class="act" onclick="claimHold()">Claim $45</button> <button class="ghost" onclick="dropHold()">Let it go</button>':'')
      +'</div>').join(''):'<p style="color:#9fc3a4">No messages. Peaceful. Suspiciously peaceful.</p>';
  }
  el.innerHTML=h;
}
function buyBike(){ if(spend(80,'bike')){ S.hasBike=true; toast('🚲 BIKE! The map just got smaller.'); renderPhone(); } }
function buyRoom(id){ const it=ROOM_ITEMS.find(i=>i.id===id);
  if(spend(it.c,'room: '+it.t)){ S.room.push(it); toast(it.t+' — check your room.'); renderPhone(); } }
function sellRoom(id){ const ix=S.room.findIndex(i=>i.id===id); if(ix<0) return;
  const it=S.room[ix]; S.room.splice(ix,1); S.money+=Math.floor(it.c/2);
  toast('Sold for $'+Math.floor(it.c/2)+'. Depreciation stings.'); hud(); renderPhone(); }
function scroll(){ S.scrolls++; const gain=[10,5,2,1][Math.min(S.scrolls-1,3)];
  advance(45); S.energy=Math.min(100,S.energy+gain);
  toast('“5 minutes” was 45. +'+gain+' energy. The trap is the recharge.');
  if($('phone').classList.contains('open')) renderPhone(); }
function partyYes(){ const m=MSGS.find(m=>m.from==='friend'&&!m.answered); if(m) m.answered=true;
  if(spend(15,'party')){ S.energy=Math.min(100,S.energy+25); toast('Fun night. $15 + Saturday gone.'); } renderPhone(); }
function partyNo(){ const m=MSGS.find(m=>m.from==='friend'&&!m.answered); if(m) m.answered=true;
  S.resisted++; toast("Skipped. FOMO is free; parties aren't."); renderPhone(); }
function claimHold(){ if(S.hold24&&spend(45,'sneakers')){ S.hold24=null; toast('Sneakers claimed.'); } renderPhone(); }
function dropHold(){ S.hold24=null; S.resisted++; toast('Let them go. The urge expired.'); renderPhone(); }
/* ================= PAYDAY / REVIEW ================= */
setInterval(()=>{ if(!S.weekOver&&S.day===4&&S.min>=17*60&&S.accrued>0){
  S.money+=S.accrued;
  pushMsg('boss','PAYDAY: $'+S.accrued.toFixed(2)+' deposited. FICA took its cut first.');
  toast('💰 PAYDAY +$'+S.accrued.toFixed(2)); S.accrued=0; hud(); } },1000);
function sundayReview(){
  S.weekOver=true; S.moving=false;
  const bills=BILLS_SUNDAY-(S.groceriesBought?65:0), ok=S.money>=bills;
  if(ok) S.money-=bills;
  const cats=Object.entries(S.spent).filter(([,v])=>v>0).map(([k,v])=>'<div class="row"><span>'+k+'</span><b class="neg">-$'+v.toFixed(0)+'</b></div>').join('');
  $('review').innerHTML='<div style="max-width:440px;margin:0 auto">'
    +'<div class="big">Sunday night.</div><p>The week is over. Here\'s the truth:</p>'
    +'<div class="card"><h4>Money</h4>'
    +'<div class="row"><span>Hours worked</span><b>'+S.hrsWorked+'h</b></div>'+cats
    +'<div class="row"><span>Sunday bills '+(ok?'(paid)':'(COULDN\'T PAY)')+'</span><b class="'+(ok?'':'neg')+'">-$'+bills+'</b></div>'
    +'<div class="row"><span><b>Left</b></span><b class="'+(S.money>=0?'pos':'neg')+'">$'+Math.round(S.money)+'</b></div></div>'
    +'<div class="card"><h4>Behavior</h4>'
    +'<div class="row"><span>Temptations resisted</span><b>'+S.resisted+'</b></div>'
    +'<div class="row"><span>Ads bought</span><b class="'+(S.adsBought?'neg':'pos')+'">'+S.adsBought+'</b></div>'
    +'<div class="row"><span>Time scrolled</span><b>'+Math.round(S.scrolls*45/60*10)/10+'h</b></div>'
    +'<div class="row"><span>Decor owned</span><b>'+(S.room.length?S.room.map(i=>i.t).join(', '):'none — beautifully bare')+'</b></div></div>'
    +(S.hasBike?'<p class="pos">🚲 Bike owner. The map is yours.</p>':'<p>🚲 Bike: $80 in Shop. Walking is honest, but slow.</p>')
    +(!ok?'<p class="neg">⚠️ Bills not covered. Late fees, stress, borrowing — that\'s what reserves prevent.</p>':'<p class="pos">✅ Bills covered. That\'s the whole game.</p>')
    +'<button class="act" style="width:100%;padding:14px;font-size:16px" onclick="location.reload()">↻ Live another week</button></div>';
  $('review').classList.add('open');
}
/* ================= INIT ================= */
function renderJobPick(){
  $('jobpick').innerHTML=JOBS[S.age].map((j,i)=>'<button data-j="'+j.id+'" class="'+(i===0?'on':'')+'">'+j.t+' $'+j.w+'</button>').join('');
  document.querySelectorAll('#jobpick button').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('#jobpick button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); S.job=JOBS[S.age].find(j=>j.id===b.dataset.j); });
  S.job=JOBS[S.age][0];
}
document.querySelectorAll('.agepick button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.agepick button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); S.age=b.dataset.a; renderJobPick(); });
$('gobtn').onclick=()=>{ $('start').style.display='none';
  MAPS.town.bld.work.label=S.job.t.toUpperCase().slice(0,16);
  pushMsg('boss','Welcome! Walk to WORK and tap the door for a shift (8h at 18+). Payday Friday.');
  pushMsg('mom','Bills Sunday: $230. The Shop tab has room decor — needs vs wants, kiddo.');
  hud(); };
$('waitbtn').onclick=()=>{ if(!S.weekOver){ advance(30); } };
buildTown(); buildMallIn(); S.rain=Math.random()<0.25; loadSprites();
renderJobPick(); hud(); draw(); requestAnimationFrame(step);
</script>
</body>
</html>
